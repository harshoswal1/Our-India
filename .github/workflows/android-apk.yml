name: Android APK

# Builds the app on every push that touches android/ and publishes it as the latest GitHub
# release, as OurIndia.apk. The website's download button points at
# releases/latest/download/OurIndia.apk, so it always serves this newest build.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OurIndia.apk"

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Our India · build ${{ github.run_number }}
          body: |
            Debug build of ${{ github.sha }}.
            Install on Android 8.0 or newer: open OurIndia.apk on the phone and allow installing from your browser if asked.
          files: OurIndia.apk
          make_latest: "true"
